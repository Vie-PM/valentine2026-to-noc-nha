<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào bé Nóc Nhà của chị 💝</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: #000;
            color: white;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .font-romantic { font-family: 'Dancing Script', cursive; }

        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            transition: all 1s ease-in-out;
            z-index: 10;
        }

        .hidden { 
            display: none !important; 
            opacity: 0;
            pointer-events: none;
        }

        .book-container {
            perspective: 1500px;
            width: 100%;
            max-width: 340px; 
            height: 50vh;
            position: relative;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
            border-radius: 0 15px 15px 0;
            background: white;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.3);
        }

        .page.flipped { transform: rotateY(-180deg); }

        .page-content {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start;
            border-radius: 0 15px 15px 0;
            overflow: hidden;
            background: white;
        }

        .page-back {
            transform: rotateY(180deg);
            background: #fff5f7;
            justify-content: center;
        }

        .photo-caption {
            width: 100%;
            padding: 10px 5px;
            background: white;
            color: #e11d48;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.1rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #ffe4e6;
            line-height: 1.3;
        }

        .photo-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }

        .photo-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #universe-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .btn-primary {
            background: #fb7185;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            box-shadow: 0 4px 20px rgba(251, 113, 133, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary:hover { background: #f43f5e; transform: scale(1.05); }
        .btn-primary:active { transform: scale(0.95); }

        .btn-sparkle {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1rem 2.5rem;
            box-shadow: 0 0 20px rgba(255, 8, 68, 0.6);
            animation: pulse-action 2s infinite;
            z-index: 100;
            position: relative;
        }

        @keyframes pulse-action {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 8, 68, 0.7); }
            50% { transform: scale(1.05); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 8, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 8, 68, 0); }
        }

        .fade-in-up { animation: fadeInUp 1s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fb7185;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .text-glow {
            text-shadow: 0 0 10px rgba(255, 183, 197, 0.8), 0 0 20px rgba(255, 183, 197, 0.5);
        }

        /* Video portrait mode */
        .video-portrait {
            max-width: 400px !important;
            width: auto !important;
            height: 70vh !important;
            max-height: 600px !important;
        }
    </style>
</head>
<body>

    <canvas id="universe-canvas"></canvas>

    <!-- MÀN 1: MỞ ĐẦU -->
    <div id="screen-1" class="screen bg-[#fffafa] text-gray-800">
        <div class="text-center max-w-md p-8 bg-white rounded-[2rem] shadow-2xl fade-in-up border border-rose-50">
            <div class="mb-6 flex justify-center">
                <div class="p-4 bg-rose-50 rounded-full">
                    <i data-lucide="heart" class="w-12 h-12 text-rose-400 fill-current"></i>
                </div>
            </div>
            <h1 class="text-4xl font-romantic text-rose-500 mb-4">Chào bé Nóc Nhà của chị &lt;3</h1>
            <p class="text-gray-500 mb-8 leading-relaxed">Nhân dịp 14/2 xa nhau, hãy đeo tai nghe và thưởng thức bí mật nhé!</p>
            
            <div class="flex flex-col space-y-4 items-center">
                <button onclick="playIntro()" id="intro-btn" class="btn-primary">
                    <i data-lucide="mic"></i>
                    <span>Em nghe xem quen không nào</span>
                </button>
                <button onclick="pauseIntro()" id="pause-btn" class="text-sm text-gray-400 hover:text-rose-400 transition-colors uppercase tracking-widest hidden" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <i data-lucide="pause-circle" style="width: 16px; height: 16px;"></i>
                    <span>Tạm dừng</span>
                </button>
                <button onclick="goToBook()" class="text-xs text-gray-300 hover:text-rose-400 transition-colors uppercase tracking-widest" style="background: none; border: none; cursor: pointer;">Bỏ qua âm thanh</button>
            </div>
            <audio id="audio-intro" src="Voice_dau.mp3" onended="goToBook()"></audio>
        </div>
    </div>

    <!-- MÀN 2: LẬT SÁCH ẢNH -->
    <div id="screen-2" class="screen hidden bg-white text-gray-800">
        <div class="mb-6 text-center">
            <h2 class="text-3xl font-romantic text-rose-400">Câu chuyện chúng mình</h2>
            <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-[0.2em]">Chạm vào bên phải để lật trang</p>
        </div>
        
        <div class="book-container" id="book"></div>

        <div class="mt-8 flex flex-col items-center space-y-6">
            <div class="flex items-center space-x-6 bg-rose-50 px-6 py-2 rounded-full shadow-sm">
                <button onclick="resetBook()" class="text-rose-300 hover:text-rose-500" style="background: none; border: none; cursor: pointer;">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
                <span class="text-rose-500 font-bold text-lg" id="page-progress">1 / 16</span>
                <button onclick="forceNextPage()" class="text-rose-300 hover:text-rose-500" style="background: none; border: none; cursor: pointer;">
                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
            </div>
            
            <button id="to-video-btn" onclick="goToVideo()" class="btn-primary opacity-30 pointer-events-none scale-90 transition-all duration-500">
                <span>Gửi tặng em thước phim này</span>
                <i data-lucide="film"></i>
            </button>
        </div>
    </div>

    <!-- MÀN 3: VIDEO -->
    <div id="screen-3" class="screen hidden bg-[#050505]">
        <div class="w-full flex flex-col items-center px-4">
            <div class="relative video-portrait rounded-3xl overflow-hidden shadow-[0_0_60px_rgba(251,113,133,0.3)] border border-white/10">
                <video id="main-video" class="w-full h-full object-cover">
                    <source src="video1.mp4" type="video/mp4">
                </video>
            </div>
            
            <div class="mt-10 flex flex-col items-center space-y-8 w-full z-50">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleVideo()" id="video-control-btn" class="bg-white/10 hover:bg-white/20 text-white px-8 py-3 rounded-full flex items-center space-x-2 backdrop-blur-md" style="border: none; cursor: pointer;">
                        <i data-lucide="play" id="video-icon"></i>
                        <span id="video-text">Xem video</span>
                    </button>
                </div>
                
                <button id="final-surprise-btn" onclick="goToFinal()" class="hidden btn-primary btn-sparkle px-10 py-4 transform hover:scale-110">
                    <span>Món quà cuối cùng</span>
                    <i data-lucide="sparkles"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MÀN 4: VŨ TRỤ TRÁI TIM PASTEL -->
    <div id="screen-4" class="screen hidden" style="justify-content: space-between; padding-top: 3rem; padding-bottom: 3rem;">
        <div class="text-center z-50 pointer-events-none select-none px-6 mt-4">
            <h2 class="text-5xl md:text-7xl font-romantic text-rose-200 mb-2 drop-shadow-2xl text-glow">Mãi yêu em...</h2>
            <p class="text-rose-100/60 text-xs tracking-[0.4em] uppercase text-glow" id="scroll-hint">Vuốt nhẹ để cảm nhận</p>
        </div>
        
        <div class="flex flex-col space-y-6 z-50 mb-8 items-center w-full" style="pointer-events: auto;">
            <button onclick="playOutro()" id="outro-btn" class="bg-white/10 border border-rose-200/30 text-rose-100 px-10 py-4 rounded-full backdrop-blur-xl hover:bg-white/20 transition-all flex items-center space-x-2 shadow-[0_0_20px_rgba(251,113,133,0.3)] hidden">
                <i data-lucide="heart" class="w-5 h-5 text-rose-300 fill-rose-300"></i>
                <span>Lắng nghe lời kết thúc</span>
            </button>
            <button onclick="location.reload()" class="text-[10px] text-white/20 hover:text-white/60 transition-colors tracking-widest uppercase" style="background: none; border: none; cursor: pointer;">Xem lại từ đầu</button>
        </div>
        <audio id="audio-outro" src="voice_cuoi.mp3"></audio>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // MAP TÊN FILE
        const fileMap = {
            1: '1.jpeg',
            2: '2.jpeg', 
            3: '3.jpeg',
            4: '4.jpeg',
            5: '5.jpeg',
            6: '6.JPG',
            7: '7.JPG',
            8: '8.PNG',
            9: '9.jpeg',
            10: '10.jpeg',
            11: '11.JPG',
            12: '12.JPG',
            13: '13.JPG',
            14: '14.JPG',
            15: '15.jpg',
            16: '16.jpeg'
        };
        
        function getImagePath(num) {
            return fileMap[num] || num + '.jpg';
        }
        
        const imageCaptions = [
            "Lần đầu em dắt đi ngắm hoàng hôn",
            "Hoàng hôn đầu tiên (em chưa là của chị)",
            '"Cô bé dễ xỉn" hóa ra là...bẫy :))))',
            "Buổi nằm ngắm rừng thông đầu tiên, chị đã nghĩ đến việc yêu em",
            "Ngắm trộm hihi",
            "Hoàng hôn tỏ tình hihi",
            "Bé khóc nè",
            "Valentine đầu tiên",
            "Món ăn ấm áp",
            "Trip đầu tiên nah",
            "Hình ny của chị ngày đầu là ny (8/3)",
            "Khung cửa của tụi mình",
            "Cùng nhau ăn chay",
            "Nắng cháy như mình yêu :))",
            "Yêu em",
            "Nắm tay nhau đi khám phá"
        ];
        
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => {
                s.style.opacity = '0';
                setTimeout(() => s.classList.add('hidden'), 800);
            });
            setTimeout(() => {
                const next = document.getElementById(id);
                next.classList.remove('hidden');
                setTimeout(() => next.style.opacity = '1', 50);
            }, 850);
        }

        function playIntro() {
            const audio = document.getElementById('audio-intro');
            const btn = document.getElementById('intro-btn');
            const pauseBtn = document.getElementById('pause-btn');
            
            btn.innerHTML = `<div class="loader mr-2"></div><span>Chị đang nói...</span>`;
            pauseBtn.classList.remove('hidden');
            
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        console.log("Audio playing");
                    })
                    .catch((error) => {
                        console.log("Audio prevented:", error.message);
                        btn.innerHTML = `<i data-lucide="mic"></i><span>Nhấn để nghe lại</span>`;
                        pauseBtn.classList.add('hidden');
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                        setTimeout(goToBook, 2000);
                    });
            }
        }

        function pauseIntro() {
            const audio = document.getElementById('audio-intro');
            const btn = document.getElementById('intro-btn');
            const pauseBtn = document.getElementById('pause-btn');
            
            audio.pause();
            btn.innerHTML = `<i data-lucide="mic"></i><span>Em nghe xem quen không nào</span>`;
            pauseBtn.classList.add('hidden');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function goToBook() {
            // Stop audio khi chuyển màn
            const audio = document.getElementById('audio-intro');
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            
            showScreen('screen-2');
            initBook();
        }

        const totalImages = 16; 
        let flippedCount = 0;
        let pages = [];

        function initBook() {
            const book = document.getElementById('book');
            book.innerHTML = '';
            pages = [];
            flippedCount = 0;
            document.getElementById('page-progress').innerText = `1 / ${totalImages}`;

            for (let i = totalImages; i >= 1; i--) {
                const page = document.createElement('div');
                page.className = 'page';
                page.style.zIndex = totalImages - i;
                page.onclick = () => flipPage(page);
                
                const captionText = imageCaptions[i-1] || `Kỷ niệm số ${i}`;
                const imagePath = getImagePath(i);

                page.innerHTML = `
                    <div class="page-content">
                        <div class="photo-container">
                            <img src="${imagePath}" alt="Ảnh ${i}">
                        </div>
                        <div class="photo-caption">
                            ${captionText}
                        </div>
                    </div>
                    <div class="page-content page-back">
                        <div class="text-rose-200 font-romantic text-2xl">Yêu em ❤️</div>
                    </div>
                `;
                book.appendChild(page);
                pages.push(page);
            }
            pages.reverse(); 
            
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function flipPage(pageElement) {
            if (!pageElement.classList.contains('flipped')) {
                pageElement.classList.add('flipped');
                flippedCount++;
                document.getElementById('page-progress').innerText = `${flippedCount + 1 > totalImages ? totalImages : flippedCount + 1} / ${totalImages}`;
                
                if (flippedCount >= 3) { 
                    const btn = document.getElementById('to-video-btn');
                    btn.classList.remove('opacity-30', 'pointer-events-none', 'scale-90');
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                    btn.style.transform = 'scale(1)';
                }
            }
        }

        function forceNextPage() {
            const next = pages.find(p => !p.classList.contains('flipped'));
            if (next) flipPage(next);
        }

        function resetBook() {
            pages.forEach(p => p.classList.remove('flipped'));
            flippedCount = 0;
            document.getElementById('page-progress').innerText = `1 / ${totalImages}`;
            const btn = document.getElementById('to-video-btn');
            btn.classList.add('opacity-30', 'pointer-events-none', 'scale-90');
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.3';
        }

        function goToVideo() {
            showScreen('screen-3');
            setTimeout(() => {
                const btn = document.getElementById('final-surprise-btn');
                if (btn && btn.classList.contains('hidden')) {
                    btn.classList.remove('hidden');
                    btn.classList.add('fade-in-up');
                }
            }, 4000);
        }

        function toggleVideo() {
            const video = document.getElementById('main-video');
            const videoIcon = document.getElementById('video-icon');
            const videoText = document.getElementById('video-text');
            
            if (video.paused) {
                video.play()
                    .then(() => {
                        videoIcon.setAttribute('data-lucide', 'pause');
                        videoText.innerText = "Tạm dừng";
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    })
                    .catch(e => console.log("Video prevented:", e.message));
            } else {
                video.pause();
                videoIcon.setAttribute('data-lucide', 'play');
                videoText.innerText = "Tiếp tục";
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('main-video');
            const surpriseBtn = document.getElementById('final-surprise-btn');
            
            if (video) {
                video.addEventListener('timeupdate', () => {
                    if (video.currentTime > 3 || video.ended) {
                        if (surpriseBtn && surpriseBtn.classList.contains('hidden')) {
                            surpriseBtn.classList.remove('hidden');
                            surpriseBtn.classList.add('fade-in-up');
                        }
                    }
                });
            }
        });

        function goToFinal() {
            const video = document.getElementById('main-video');
            if(video) video.pause(); 
            showScreen('screen-4'); 
            setTimeout(() => initUniverse(), 500);
        }

        let scene, camera, renderer, points, starPositions, heartPositions;
        let progress = 0;
        let converged = false;

        function initUniverse() {
            if (scene || typeof THREE === 'undefined') return;
            
            const container = document.getElementById('universe-canvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 20;

            renderer = new THREE.WebGLRenderer({ canvas: container, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const count = 5000;
            const geo = new THREE.BufferGeometry();
            starPositions = new Float32Array(count * 3);
            heartPositions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                starPositions[i*3] = (Math.random() - 0.5) * 60;
                starPositions[i*3+1] = (Math.random() - 0.5) * 60;
                starPositions[i*3+2] = (Math.random() - 0.5) * 60;

                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 8 * Math.sin(t); 

                heartPositions[i*3] = x * 0.45;
                heartPositions[i*3+1] = y * 0.45;
                heartPositions[i*3+2] = z * 0.45;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPositions), 3));
            const mat = new THREE.PointsMaterial({ 
                color: 0xFFB7C5, 
                size: 0.15, 
                transparent: true, 
                blending: THREE.AdditiveBlending 
            });
            points = new THREE.Points(geo, mat);
            scene.add(points);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (!points) return;
            
            const positions = points.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i++) {
                const target = progress * heartPositions[i] + (1 - progress) * starPositions[i];
                positions[i] += (target - positions[i]) * 0.05;
            }
            points.geometry.attributes.position.needsUpdate = true;
            points.rotation.y += 0.002;
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
            
            if (progress > 0.8 && !converged) {
                converged = true;
                const hint = document.getElementById('scroll-hint');
                const btn = document.getElementById('outro-btn');
                if (hint) hint.style.display = 'none';
                if (btn) {
                    setTimeout(() => btn.classList.remove('hidden'), 2000);
                }
            }
        }

        function playOutro() {
            const audio = document.getElementById('audio-outro');
            const btn = document.getElementById('outro-btn');
            
            audio.play()
                .then(() => {
                    btn.innerHTML = `<i data-lucide="music" class="animate-bounce mr-2"></i><span>Đang gửi lời yêu...</span>`;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                })
                .catch(e => {
                    console.log("Outro prevented:", e.message);
                    btn.innerHTML = `<i data-lucide="heart" class="w-5 h-5 text-rose-300 fill-rose-300"></i><span>Nhấn để nghe lại</span>`;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
        }

        window.addEventListener('wheel', (e) => {
            progress += e.deltaY * 0.0015;
            progress = Math.max(0, Math.min(1, progress));
        });

        let touchY = 0;
        window.addEventListener('touchstart', e => touchY = e.touches[0].clientY);
        window.addEventListener('touchmove', e => {
            const delta = touchY - e.touches[0].clientY;
            progress += delta * 0.006;
            progress = Math.max(0, Math.min(1, progress));
            touchY = e.touches[0].clientY;
        });

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
